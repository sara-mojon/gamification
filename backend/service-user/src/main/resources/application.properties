spring.application.name=backend
server.port=8080

# ==========================================================
# 2. PERSISTENCIA (PostgreSQL en Docker)
# ==========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gamification_db
spring.datasource.username=gamification
spring.datasource.password=gamification
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Migraciones (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================================
# 3. SEGURIDAD (OAUTH2 / KEYCLOAK)
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/masorange-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/masorange-realm/protocol/openid-connect/certs