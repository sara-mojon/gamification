spring.application.name=service-user
server.port=8080

# ==========================================================
# 2. PERSISTENCIA (PostgreSQL en Docker)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gamification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gamification}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gamification_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Migraciones (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

service.challenges.url=${SERVICE_CHALLENGES_URL:http://localhost:8081}

# ==========================================================
# 3. SEGURIDAD (OAUTH2 / KEYCLOAK)
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/masorange-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/masorange-realm/protocol/openid-connect/certs}

keycloak.auth-server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=masorange-realm
keycloak.client-id=gamification-backend
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# ==========================================
# METRICS & HEALTH (ACTUATOR + PROMETHEUS)
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}