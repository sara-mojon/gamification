spring.application.name=backend2
server.port=8081

# ==========================================================
# 2. PERSISTENCIA (PostgreSQL en Docker)
# ==========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gamification_db
spring.datasource.username=gamification
spring.datasource.password=gamification
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Migraciones (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================================
# 3. SEGURIDAD (OAUTH2 / KEYCLOAK)
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/masorange-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/masorange-realm/protocol/openid-connect/certs

# Credenciales de Slack (Saca esto de api.slack.com -> Basic Information / OAuth & Permissions)
slack.bot.token=AQUI_VA_TU_TOKEN
slack.signing.secret=614e97f2b79c91277221127b8efd7ff5

# URL del microservicio de gamificación
service.gamification.url=http://localhost:8082
