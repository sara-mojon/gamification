spring.application.name=service-challenges
server.port=8081

# ==========================================================
# 2. PERSISTENCIA (PostgreSQL en Docker)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gamification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gamification}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gamification}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Migraciones (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================================
# 3. SEGURIDAD (OAUTH2 / KEYCLOAK)
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/masorange-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/masorange-realm/protocol/openid-connect/certs}

#Para debuggear en local
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/masorange-realm
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/masorange-realm/protocol/openid-connect/certs

# ==========================================================
# 4. SLACK
# ==========================================================
slack.bot.token=${SLACK_BOT_TOKEN}
slack.channel.test.id=${SLACK_CHANNEL_TEST_ID}
slack.signing.secret=${SLACK_SIGNING_SECRET}

# ==========================================================
# 5. COMUNICACIÓN ENTRE MICROSERVICIOS
# ==========================================================
service.user.url=${SERVICE_USER_URL:http://localhost:8080}
service.gamification.url=${SERVICE_GAMIFICATION_URL:http://localhost:8082}

# ==========================================================
# 6. REDIS
# ==========================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=2000

# ==========================================
# METRICS & HEALTH (ACTUATOR + PROMETHEUS)
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}