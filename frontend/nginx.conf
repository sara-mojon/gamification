server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Regla mágica para que React Router (SPA) funcione y no dé error 404 al hacer F5
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché agresiva para los estáticos de Vite (¡Carga ultra rápida!)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}