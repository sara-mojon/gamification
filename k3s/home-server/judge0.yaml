# k3s/home-server/judge0.yaml

apiVersion: v1
kind: Service
metadata:
  name: judge0-server
  namespace: sara
spec:
  selector:
    app: judge0-server
  ports:
    - protocol: TCP
      port: 2358
      targetPort: 2358
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: judge0-env
  namespace: sara
data:
  POSTGRES_HOST: "postgres-infra"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "judge0"
  POSTGRES_USER: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JUDGE0_TELEMETRY_ENABLE: "false"
  JUDGE0_HOMEPAGE_ENABLE: "true"
  JUDGE0_CONF_FILE: "/dev/null"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0-server
  namespace: sara
spec:
  replicas: 3
  selector:
    matchLabels:
      app: judge0-server
  template:
    metadata:
      labels:
        app: judge0-server
    spec:
      hostPID: true 
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ["sh", "-c", "until nc -z postgres-infra 5432; do echo waiting for db; sleep 2; done;"]
      containers:
        - name: judge0-server
          image: judge0/judge0:1.13.1
          ports:
            - containerPort: 2358
          envFrom:
            - configMapRef:
                name: judge0-env
          env:
            - name: RAILS_MAX_THREADS
              value: "8"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: redis-password
          securityContext:
            privileged: true 
          volumeMounts:
            - name: isolate-data
              mountPath: /var/local/lib/isolate
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1.5Gi"
              cpu: "2000m"
      volumes:
        - name: isolate-data
          hostPath:
            path: /home/sara/k3s/judge0-data
            type: DirectoryOrCreate