# k3s/home-server/lgtm.yaml

# 1. Configuración de LOKI (El almacén de logs)
loki:
  enabled: true
  isDefault: true
  commonConfig:
    replication_factor: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "local-path" # K3s default storage

# 2. Configuración de PROMTAIL (El recolector)
promtail:
  enabled: true
  config:
    # Se despliega como DaemonSet (uno en cada nodo: Home + AI)
    lokiAddress: http://lgtm-loki:3100/loki/api/v1/push
    clients:
      - url: http://lgtm-loki:3100/loki/api/v1/push

# 3. Configuración de GRAFANA (El visualizador)
grafana:
  enabled: true
  sidecar:
    datasources:
      enabled: true # Auto-conecta Loki a Grafana
      label: "grafana_datasource" # Importante para que Loki se autoconfigure

  # Seguridad básica (Cambiaremos a Keycloak luego)
  adminPassword: "admin"

  # Persistencia de Dashboards y Usuarios
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: "local-path"

  # Acceso Web
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.sara.local
    # Si quieres HTTPS inmediato con tu certificado wildcard:
    tls:
      - secretName: sara-local-tls
        hosts:
          - grafana.sara.local

  # Optimización de recursos (Ligero)
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
