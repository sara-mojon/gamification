# k3s/home-server/service-gamification.yaml

apiVersion: v1
kind: Service
metadata:
  name: service-gamification
  namespace: sara
spec:
  type: ClusterIP
  selector:
    app: service-gamification
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-gamification
  namespace: sara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-gamification
  template:
    metadata:
      labels:
        app: service-gamification
    spec:
      hostAliases:
        - ip: "100.114.58.117"
          hostnames:
            - "ai-server.taild995dd.ts.net"
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              'until nc -z -v -w30 postgres-infra 5432; do echo "Waiting for DB..."; sleep 2; done;',
            ]
      containers:
        - name: service-gamification
          image: saramojon/service-gamification:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: gamification-db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: gamification-db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: gamification-db-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "20"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "5"
            - name: SERVER_TOMCAT_THREADS_MAX
              value: "500"
            - name: SERVER_TOMCAT_ACCEPT_COUNT
              value: "200"
            - name: OLLAMA_URL
              value: "http://ai-server.taild995dd.ts.net"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: keycloak-issuer-uri
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/masorange-realm/protocol/openid-connect/certs"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
